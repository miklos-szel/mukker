name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build DMG
        run: make dmg

      - name: Compute checksum
        id: sha
        run: |
          DMG=$(ls dist/*.dmg | head -n1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sha.outputs.dmg }}
          body: |
            Ad-hoc signed build. After installing via the DMG, the first launch may be blocked by Gatekeeper —
            right-click the app and choose **Open**, or install through the Homebrew cask (which strips the quarantine flag).

            DMG SHA-256: `${{ steps.sha.outputs.sha256 }}`

      # This repo doubles as its own Homebrew tap, so the cask has to follow the
      # release it describes — otherwise `brew install` keeps serving the
      # previous DMG.
      - name: Update the cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256="${{ steps.sha.outputs.sha256 }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Someone can land on main while the DMG builds, which would make the
          # push a non-fast-forward. Rebuild the commit on top of whatever main
          # is now and try again rather than failing a release that has already
          # published.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/mukker.rb
            sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" Casks/mukker.rb
            if git diff --quiet Casks/mukker.rb; then
              echo "cask already current"
              exit 0
            fi
            git commit -m "Update cask to ${VERSION}" Casks/mukker.rb
            if git push origin main; then
              exit 0
            fi
            echo "main moved under us; retrying (attempt ${attempt}/3)"
          done
          echo "could not update the cask after 3 attempts" >&2
          exit 1
