name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; the one job that publishes asks for more itself.
permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      # Creating the release and pushing the cask update back to main.
      contents: write
    steps:
      # The version goes into the release notes lookup and, via sed, into the
      # cask file users install — so it must be a plain X.Y.Z before anything
      # uses it. Later steps read it from this step's output, never from the
      # raw tag name.
      - name: Validate version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION="${TAG#v}"
          # [[ =~ ]] matches the whole string, embedded newlines included.
          # The tag itself is not echoed: it is untrusted input.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag is not of the form vX.Y.Z (e.g. v1.2.0); refusing to release."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build DMG
        run: make dmg

      - name: Compute checksum
        id: sha
        run: |
          DMG=$(ls dist/*.dmg | head -n1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # Every release lists its changes: the notes are this version's section of
      # CHANGELOG.md. A tag without one fails here, before anything is published,
      # rather than shipping a release that says nothing about what changed.
      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi
          {
            echo "## What's changed"
            cat changes.md
            echo
            echo "---"
            echo
            echo "Ad-hoc signed build. After installing via the DMG, the first launch may be blocked by Gatekeeper —"
            echo "right-click the app and choose **Open**, or install through the Homebrew cask (which strips the quarantine flag)."
            echo
            echo "DMG SHA-256: \`${{ steps.sha.outputs.sha256 }}\`"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ steps.sha.outputs.dmg }}
          body_path: release-notes.md

      # This repo doubles as its own Homebrew tap, so the cask has to follow the
      # release it describes — otherwise `brew install` keeps serving the
      # previous DMG.
      - name: Update the cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA256="${{ steps.sha.outputs.sha256 }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Someone can land on main while the DMG builds, which would make the
          # push a non-fast-forward. Rebuild the commit on top of whatever main
          # is now and try again rather than failing a release that has already
          # published.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/mukker.rb
            sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" Casks/mukker.rb
            if git diff --quiet Casks/mukker.rb; then
              echo "cask already current"
              exit 0
            fi
            git commit -m "Update cask to ${VERSION}" Casks/mukker.rb
            if git push origin main; then
              exit 0
            fi
            echo "main moved under us; retrying (attempt ${attempt}/3)"
          done
          echo "could not update the cask after 3 attempts" >&2
          exit 1
